[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scribe-gate"
version = "0.1.2"
description = "Scribe: a validation gauntlet and trust gate for agent-written Python code"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Pongtana Feronti" }]
keywords = ["agents", "validation", "code-review", "trust-gate", "llm", "devops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx>=0.27",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
tools = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8",
    "pip-audit>=2.7",
    "pre-commit>=3",
]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
scribe = "scribe.cli:main"
scribe-gate = "scribe.cli:main"

[project.urls]
Homepage = "https://github.com/Mrpongalfer/scribe"
Repository = "https://github.com/Mrpongalfer/scribe"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
# tests/fixtures contains deliberately broken files for the gauntlet tests.
exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
